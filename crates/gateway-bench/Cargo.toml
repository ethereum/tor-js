[package]
name = "gateway-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Load and memory tests for tor-js-gateway against a mock Tor relay farm"

[dependencies]
# Same spec as the gateway's, so both resolve to one kps.
kps = { git = "https://github.com/ethereum/kps", tag = "libs/rust/v0.3.1" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
